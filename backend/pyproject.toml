[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
